---
version: 1
repository:
  owner: VMAFx
  name: pelorus
  default_branch: master
  visibility: public
  description: ""
  homepage: ""
  topics: []
profiles:
  - native-gpu-systems
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
overrides:
  branch_protection:
    review_mode: single_maintainer
    # Declared at its live value; the forge default is the stricter one.
    require_extra_approval_for_unattributed_changes: true
register:
  sources:
    expected: 12
    sha256:
      sha256:9a342c0b70e1a3293a6a6ac58629348e8d406f0a7c287e92298f108b09573cbf
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
clang_tidy:
  lanes:
    - name: "libpelorus"
      files: ".config/clang-tidy/lane-files.txt"
    - name: "ffmpeg-tree"
      files: ".config/clang-tidy/ffmpeg-tree-files.txt"
exceptions:
  - rule: clang-tidy-coverage
    path: libpelorus/test/fixtures/telemetry/libaom-record.c
    reason: "category D, capped at the engine maximum of 90 days: fixture recorder built by hand against libaom, which Meson does not depend on, so no compile database entry exists; follow-up: an optional Meson target once a libaom build dependency has an ADR (VMAFx/pelorus#111)"
    expires: "2027-01-13"
  - rule: declared-linters
    tool: cppcheck
    reason: "category D, capped at the engine maximum of 90 days: no workflow runs cppcheck yet; C static analysis runs through clang-tidy on every Meson-built unit (make verify-native, CI core job, ADR-0168), and a cppcheck lane first needs a recorded baseline of its current findings (ADR-0190)"
    expires: "2027-01-11"
  - rule: declared-linters
    tool: trivy
    reason: "category D, capped at the engine maximum of 90 days: no workflow runs trivy yet; it needs a pinned vulnerability database, because trivy downloads its database at run time and two runs of one commit can disagree (ADR-0190)"
    expires: "2027-01-11"
  - rule: HISS-07
    path: .config/lefthook/scripts/common.py
    reason: "category B, 3 days: engine-shipped empty excepts at lines 842 and 865 fail scripts/check-python-empty-except.py and raise code-scanning alert #59 (py/empty-except); engine finding engine-adopted-hook-bot-findings-20261102, fix tracked in cordanaLLM/praetor#1768 (renewed 2026-11-08: still open, engine 5dfdd28b34d4 ships the same excepts)"
    expires: "2026-11-11"
  - rule: HISS-19
    path: libpelorus/src/qp_report_csv.c
    reason: "category D, capped at the engine maximum of 90 days: second x265 CSV reader kept beside pel_tlm_parse_x265_csv because this file is VMAFx-mirrored (libpelorus/mirror-paths.txt:12, ADR-0197) and a shared helper would change the mirrored file; libpelorus/test/x265_csv_characterization_test.c pins both readers; revisit when VMAFx drops the host-C mirror (VMAFx/pelorus#496)"
    expires: "2027-02-01"
release:
  e2e:
    since: e79218aec5daf2bc096973c88c3c68c6834cbb80
