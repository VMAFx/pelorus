version: 1
repository:
  owner: VMAFx
  name: pelorus
  default_branch: master
  visibility: public
  description: ""
  homepage: ""
  topics: []
profiles:
  - native-gpu-systems
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
overrides:
  branch_protection:
    review_mode: single_maintainer
register:
  sources:
    expected: 12
    sha256:
      sha256:9a342c0b70e1a3293a6a6ac58629348e8d406f0a7c287e92298f108b09573cbf
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
