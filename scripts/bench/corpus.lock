# RE-PINNED 2026-08-30 — THIS RESETS THE bbb BASELINE.
#
# The previous pin (download.blender.org BigBuckBunny_640x360.m4v, sha256 738e2f99...)
# is gone: the host returns nginx 404 for both HEAD and ranged GET and no mirror serves
# the same bytes, so `fetch-corpus.sh` could not materialise it on a cold machine.
#
# Replacement is the same content family and, deliberately, the same WORKLOAD SHAPE:
# 640x360 yuv420p and 48 extracted frames, so the decoded .yuv is byte-for-byte the same
# size (16,588,800) and the harness runs an identical amount of work. What changed is the
# PIXELS — a different encode and a different segment of Big Buck Bunny.
#
# Therefore: every absolute bbb number recorded in docs/development/bench-results.md
# before this date was measured against the OLD clip and is NOT comparable to anything
# measured after it. Re-baseline before quoting a bbb delta across that boundary.
# The synth-banding entry is unaffected (it is generated by lavfi, not downloaded).
#
# Pinned benchmark corpus — repeatable proof inputs. One clip per line:
#   name | url | sha256 | ffmpeg-input-seek-args | scale | pixfmt | frames | fps
# fetch-corpus.sh downloads (cached), verifies the sha256, and extracts the
# pinned segment to raw YUV so the bench is byte-reproducible from the source.
# Big Buck Bunny (Blender Foundation, CC-BY 3.0) — the canonical free clip.
# Segment is a fixed 4s window; scaled to an even 640x360 (source is 640x359).
bbb | https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/360/Big_Buck_Bunny_360_10s_30MB.mp4 | 1472c825b2936af0a23f1fb9d5f672423f71bc4b8f563f9db47fd767f01168dd | -ss 4 -t 2 | 640x360 | yuv420p | 48 | 30

# Deterministic synthetic torture clip for deband (max banding; no download).
# Generated by fetch-corpus.sh via lavfi gradients — fully reproducible.
# netflix-bar — Netflix "Chimera" BarScene, donated to Xiph.Org's derf collection.
# Real camera content, and the point of it is CONTENT COMPLEXITY, not grain. Measured
# against the bbb pin at the same 640x360/48-frame workload (pelorus_analyze +
# pelorus_grain_estimate):
#     texture  0.225 vs 0.094   (2.4x)
#     variance 0.0196 vs 0.0063 (3.1x)
#     banding  0.242 vs 0.142   (1.7x)
#     grain_sigma 0.0124 vs 0.0131  -- NOT grainier; see below
# It is deliberately NOT pinned as a grain source: this .webm is a VP9 distribution
# copy (~6.9 Mbit/s for 4K) and the encode removed most of the grain. The ungraded
# .y4m original does retain it but is 29.6 GB, which is not pinnable. For a grain
# axis use run-bench.py's `--synth noise`, or inject seeded noise into real content --
# both give a monotonic grain response (verified: grain_sigma 0.0132 -> 0.0214 as
# injected noise goes 0 -> 20, with grain_flat 0.331 -> 0.005).
# Host durability was the other reason to add it: media.xiph.org is a foundation-run
# archive, unlike the single third party the bbb pin now depends on.
netflix-bar | https://media.xiph.org/video/derf/webm/Netflix_BarScene_4096x2160_60fps_10bit_420.webm | 15b3a0cafbf68f48bc2e7db9785f539cb6fe3e1db5c90608df4dbcc96c69d85c | -ss 6 -t 2 | 640x360 | yuv420p | 48 | 60

