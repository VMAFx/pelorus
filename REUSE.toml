#
# Copyright and licence of every file in the repository (ADR-0171,
# docs/licensing.md). REUSE 3.3 applies only the last table whose path matches
# a file, whatever its precedence, so the whole-tree default comes first and
# every narrower table follows it; `praetorctl audit` fails a table that a later
# one shadows completely.

version = 1

# Pelorus is written by Lusoris and licensed under the EUPL-1.2. The default
# also covers the generated files (CHANGELOG.md, the agent context projections,
# .standards-baseline.json) and the files Praetor manages, whose author and
# licence are the same (Praetor's own REUSE.toml: EUPL-1.2, Lusoris).
# "closest" lets a file's own SPDX header win where it has one.
[[annotations]]
path = ["*", ".*", "*/**", ".*/**"]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Lusoris"
SPDX-License-Identifier = "EUPL-1.2"

# Sources the patch stack adds to the FFmpeg tree: the filters, the bitstream
# filter, their shared headers and the shipped shaders. They become part of
# FFmpeg, so they keep FFmpeg's LGPL-2.1-or-later (ADR-0105, kept by ADR-0171).
# Each file names Lusoris in its LGPL header, which REUSE reads.
[[annotations]]
path = [
    "ffmpeg-patches/files/*.c",
    "ffmpeg-patches/files/*.h",
    "ffmpeg-patches/files/vulkan/**",
]
precedence = "closest"
SPDX-FileCopyrightText = "2026 Lusoris"
SPDX-License-Identifier = "LGPL-2.1-or-later"

# The nine Vulkan filter host files follow FFmpeg's model filters
# (vf_gblur_vulkan.c, vf_nlmeans_vulkan.c, vf_scdet_vulkan.c) and share their
# API idiom, so the FFmpeg developers are named next to Lusoris (ADR-0171).
# The files themselves stay unchanged, which keeps the patch stack byte-stable.
[[annotations]]
path = ["ffmpeg-patches/files/vf_pelorus_*_vulkan.c"]
precedence = "override"
SPDX-FileCopyrightText = ["2000-2026 the FFmpeg developers", "2026 Lusoris"]
SPDX-License-Identifier = "LGPL-2.1-or-later"

# The patches change FFmpeg's own LGPL-2.1-or-later sources (configure,
# Makefiles, allfilters.c, the NVENC, QSV, libaom, SVT-AV1 and Vulkan encoders,
# hwcontext_vulkan.c) and carry their context lines, so FFmpeg's copyright
# applies next to Lusoris's. The numbered patches are generated by
# ffmpeg-patches/generate.sh; the others under files/ are its inputs.
[[annotations]]
path = ["ffmpeg-patches/0*.patch", "ffmpeg-patches/files/*.patch"]
precedence = "override"
SPDX-FileCopyrightText = ["2000-2026 the FFmpeg developers", "2026 Lusoris"]
SPDX-License-Identifier = "LGPL-2.1-or-later"

# obra/superpowers process skills, vendored verbatim with their MIT licence
# (.claude/skills/superpowers/LICENSE). NOTICE.md beside them is Pelorus's own
# note on the vendoring, so the next table gives it back the default.
[[annotations]]
path = [".claude/skills/superpowers/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Jesse Vincent"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = [".claude/skills/superpowers/NOTICE.md"]
precedence = "override"
SPDX-FileCopyrightText = "2026 Lusoris"
SPDX-License-Identifier = "EUPL-1.2"

# `praetorctl adopt` writes Praetor's figure engine under tools/figures/. Its
# vendored interfig sources keep their upstream MIT terms, and the committed
# player bundles Praetor's loader (EUPL-1.2) with interfig, React, react-dom and
# scheduler (MIT); dist/THIRD-PARTY-LICENSES.txt carries those texts. Both
# tables copy Praetor's own REUSE.toml.
[[annotations]]
path = ["tools/figures/third_party/interfig/upstream/**"]
precedence = "override"
SPDX-FileCopyrightText = "2025 Vectorize AI, Inc."
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["tools/figures/dist/**"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Lusoris <lusoris@proton.me>",
    "2025 Vectorize AI, Inc.",
    "Meta Platforms, Inc. and affiliates",
]
SPDX-License-Identifier = "EUPL-1.2 AND MIT"

# The dev container builds Praetor from this base64-encoded source archive
# (ADR-0153). The archive holds Praetor's tree, figure player and interfig
# sources included, so it carries the same terms as the two tables above.
[[annotations]]
path = [".devcontainer/praetor-source.*.b64"]
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Lusoris <lusoris@proton.me>",
    "2025 Vectorize AI, Inc.",
    "Meta Platforms, Inc. and affiliates",
]
SPDX-License-Identifier = "EUPL-1.2 AND MIT"
