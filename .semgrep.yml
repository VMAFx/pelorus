# SPDX-License-Identifier: EUPL-1.2
#
# Custom semantic patterns for Pelorus (ADR-0239).
# Derived from VMAFx/vmafx .semgrep.yml at 25ee5f3a25aebc97ee453fc3a70f676c68da2a81
# (rule vmaf-test-float-identity-via-float-bits).

rules:
  - id: pelorus-test-float-identity
    # CodeQL cpp/equality-on-floats reports `==` / `!=` between two computed
    # floating-point values. It reads only what its build compiles. This rule
    # reads every test source before the push. Comparisons against a literal,
    # a macro or k-constant, and the `x != x` NaN idiom stay `==`, as CodeQL
    # allows them. The exemption covers a whole operand only (an optional sign
    # and one literal, macro or k-constant): `1.0 + y` or `(double)(y * 2.0)`
    # stays in scope. Literals cover decimal, hexadecimal and suffixed integer
    # forms (`0x10`, `1U`). A test source declares no non-const float with a
    # macro or k-constant name; scripts/test-semgrep-float-identity.py checks
    # that. The NaN idiom covers call-free operands only. Semgrep looks
    # through casts, so any operand cast to an integer type, such as
    # `(uint64_t)expected`, makes an integer comparison and is exempt.
    # scripts/test-semgrep-float-identity.py plants each case.
    patterns:
      - pattern-either:
          # One typed side is enough: Semgrep infers no type for an
          # arithmetic operand such as `1.0 + y`, so requiring both sides
          # typed missed every comparison with a computed expression.
          - pattern: (double $A) == $B
          - pattern: $A == (double $B)
          - pattern: (double $A) != $B
          - pattern: $A != (double $B)
          - pattern: (float $A) == $B
          - pattern: $A == (float $B)
          - pattern: (float $A) != $B
          - pattern: $A != (float $B)
          # Both sides arithmetic, such as `(x + y) == (u + v)`: neither
          # side carries an inferred type, so a floating-point operand inside
          # each side selects the comparison. One side is not enough:
          # `(i + (int)x) == j` compares integers.
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-pattern:
                  metavariable: $A
                  patterns:
                    - pattern-either:
                        - pattern: (double $V)
                        - pattern: (float $V)
                    # A call argument is not an operand: `bits_of(a)`
                    # returns an integer.
                    - pattern-not-inside: $F(...)
              - metavariable-pattern:
                  metavariable: $B
                  patterns:
                    - pattern-either:
                        - pattern: (double $W)
                        - pattern: (float $W)
                    # A call argument is not an operand: `bits_of(a)`
                    # returns an integer.
                    - pattern-not-inside: $F(...)
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $X == $X
                - pattern: $X != $X
            # only a call-free operand: `next() == next()` compares two
            # results and stays in scope
            - metavariable-regex:
                metavariable: $X
                regex: '^[^()]*$'
      # Semgrep types an operand through its cast, so `(uint64_t)expected`
      # reads as the double `expected`. An integer cast makes the comparison
      # an integer one; these pairs drop it.
      - pattern-not: $X == (uint8_t) $Y
      - pattern-not: (uint8_t) $Y == $X
      - pattern-not: $X != (uint8_t) $Y
      - pattern-not: (uint8_t) $Y != $X
      - pattern-not: $X == (uint16_t) $Y
      - pattern-not: (uint16_t) $Y == $X
      - pattern-not: $X != (uint16_t) $Y
      - pattern-not: (uint16_t) $Y != $X
      - pattern-not: $X == (uint32_t) $Y
      - pattern-not: (uint32_t) $Y == $X
      - pattern-not: $X != (uint32_t) $Y
      - pattern-not: (uint32_t) $Y != $X
      - pattern-not: $X == (uint64_t) $Y
      - pattern-not: (uint64_t) $Y == $X
      - pattern-not: $X != (uint64_t) $Y
      - pattern-not: (uint64_t) $Y != $X
      - pattern-not: $X == (int8_t) $Y
      - pattern-not: (int8_t) $Y == $X
      - pattern-not: $X != (int8_t) $Y
      - pattern-not: (int8_t) $Y != $X
      - pattern-not: $X == (int16_t) $Y
      - pattern-not: (int16_t) $Y == $X
      - pattern-not: $X != (int16_t) $Y
      - pattern-not: (int16_t) $Y != $X
      - pattern-not: $X == (int32_t) $Y
      - pattern-not: (int32_t) $Y == $X
      - pattern-not: $X != (int32_t) $Y
      - pattern-not: (int32_t) $Y != $X
      - pattern-not: $X == (int64_t) $Y
      - pattern-not: (int64_t) $Y == $X
      - pattern-not: $X != (int64_t) $Y
      - pattern-not: (int64_t) $Y != $X
      - pattern-not: $X == (size_t) $Y
      - pattern-not: (size_t) $Y == $X
      - pattern-not: $X != (size_t) $Y
      - pattern-not: (size_t) $Y != $X
      - pattern-not: $X == (int) $Y
      - pattern-not: (int) $Y == $X
      - pattern-not: $X != (int) $Y
      - pattern-not: (int) $Y != $X
      - pattern-not: $X == (unsigned) $Y
      - pattern-not: (unsigned) $Y == $X
      - pattern-not: $X != (unsigned) $Y
      - pattern-not: (unsigned) $Y != $X
      - pattern-not: $X == (long) $Y
      - pattern-not: (long) $Y == $X
      - pattern-not: $X != (long) $Y
      - pattern-not: (long) $Y != $X
      - pattern-not: $X == (bool) $Y
      - pattern-not: (bool) $Y == $X
      - pattern-not: $X != (bool) $Y
      - pattern-not: (bool) $Y != $X
      - pattern-not: $X == (char) $Y
      - pattern-not: (char) $Y == $X
      - pattern-not: $X != (char) $Y
      - pattern-not: (char) $Y != $X
      - pattern-not: $X == (signed char) $Y
      - pattern-not: (signed char) $Y == $X
      - pattern-not: $X != (signed char) $Y
      - pattern-not: (signed char) $Y != $X
      - pattern-not: $X == (unsigned char) $Y
      - pattern-not: (unsigned char) $Y == $X
      - pattern-not: $X != (unsigned char) $Y
      - pattern-not: (unsigned char) $Y != $X
      - pattern-not: $X == (short) $Y
      - pattern-not: (short) $Y == $X
      - pattern-not: $X != (short) $Y
      - pattern-not: (short) $Y != $X
      - pattern-not: $X == (unsigned short) $Y
      - pattern-not: (unsigned short) $Y == $X
      - pattern-not: $X != (unsigned short) $Y
      - pattern-not: (unsigned short) $Y != $X
      - pattern-not: $X == (unsigned int) $Y
      - pattern-not: (unsigned int) $Y == $X
      - pattern-not: $X != (unsigned int) $Y
      - pattern-not: (unsigned int) $Y != $X
      - pattern-not: $X == (unsigned long) $Y
      - pattern-not: (unsigned long) $Y == $X
      - pattern-not: $X != (unsigned long) $Y
      - pattern-not: (unsigned long) $Y != $X
      - pattern-not: $X == (long long) $Y
      - pattern-not: (long long) $Y == $X
      - pattern-not: $X != (long long) $Y
      - pattern-not: (long long) $Y != $X
      - pattern-not: $X == (unsigned long long) $Y
      - pattern-not: (unsigned long long) $Y == $X
      - pattern-not: $X != (unsigned long long) $Y
      - pattern-not: (unsigned long long) $Y != $X
      - pattern-not: $X == (ssize_t) $Y
      - pattern-not: (ssize_t) $Y == $X
      - pattern-not: $X != (ssize_t) $Y
      - pattern-not: (ssize_t) $Y != $X
      - pattern-not: $X == (ptrdiff_t) $Y
      - pattern-not: (ptrdiff_t) $Y == $X
      - pattern-not: $X != (ptrdiff_t) $Y
      - pattern-not: (ptrdiff_t) $Y != $X
      - pattern-not: $X == (intptr_t) $Y
      - pattern-not: (intptr_t) $Y == $X
      - pattern-not: $X != (intptr_t) $Y
      - pattern-not: (intptr_t) $Y != $X
      - pattern-not: $X == (uintptr_t) $Y
      - pattern-not: (uintptr_t) $Y == $X
      - pattern-not: $X != (uintptr_t) $Y
      - pattern-not: (uintptr_t) $Y != $X
      - metavariable-regex:
          metavariable: $A
          regex: '^(?!\s*[-+]?\s*([0-9][0-9.]*([eE][-+]?[0-9]+)?[fFlLuU]*|0[xX][0-9A-Fa-f]+[uUlL]*|\.[0-9]+([eE][-+]?[0-9]+)?[fFlL]?|0[xX]([0-9A-Fa-f]+(\.[0-9A-Fa-f]*)?|\.[0-9A-Fa-f]+)[pP][-+]?[0-9]+[fFlL]?|k[A-Z][A-Za-z0-9_]*|[A-Z][A-Z0-9_]*)\s*$)'
      - metavariable-regex:
          metavariable: $B
          regex: '^(?!\s*[-+]?\s*([0-9][0-9.]*([eE][-+]?[0-9]+)?[fFlLuU]*|0[xX][0-9A-Fa-f]+[uUlL]*|\.[0-9]+([eE][-+]?[0-9]+)?[fFlL]?|0[xX]([0-9A-Fa-f]+(\.[0-9A-Fa-f]*)?|\.[0-9A-Fa-f]+)[pP][-+]?[0-9]+[fFlL]?|k[A-Z][A-Za-z0-9_]*|[A-Z][A-Z0-9_]*)\s*$)'
    paths:
      include:
        - /libpelorus/test/**
        - /ffmpeg-patches/test/**
    message: >
      Two computed floating-point values are compared with == or !=. Compare
      via bit patterns (such as float_bits_equal() in
      libpelorus/test/interop_test.c) or an explicit tolerance; CodeQL
      cpp/equality-on-floats reports the same defect (ADR-0239).
    languages: [c, cpp]
    severity: ERROR

  - id: pelorus-c-wall-clock-elapsed
    # Elapsed time must come from a monotonic clock. The wall clock steps when
    # NTP or an operator sets the time, so a timing on it can come out
    # negative or inflated; Codacy flagged timespec_get(..., TIME_UTC) in the
    # mc host-path timing test (pull request 545).
    paths:
      include:
        - "*.c"
        - "*.h"
        - "**/*.c"
        - "**/*.h"
    message: >
      Wall-clock read ($CALL). Measure elapsed time with
      clock_gettime(CLOCK_MONOTONIC, ...) on POSIX or QueryPerformanceCounter
      on Windows (mono_now() in ffmpeg-patches/test/mc_stats_test.c), and
      check the call's result. A genuine wall-clock timestamp carries a
      nosemgrep marker that names why.
    languages: [c, cpp]
    severity: ERROR
    pattern-either:
      - patterns:
          - pattern: $CALL($TS, TIME_UTC)
          - metavariable-regex:
              metavariable: $CALL
              regex: ^timespec_get$
      - patterns:
          - pattern: $CALL(CLOCK_REALTIME, ...)
          - metavariable-regex:
              metavariable: $CALL
              regex: ^(clock_gettime|clock_gettime64)$
      - patterns:
          - pattern: $CALL(...)
          - metavariable-regex:
              metavariable: $CALL
              regex: ^(gettimeofday|ftime|_ftime|_ftime64|GetSystemTimeAsFileTime|GetSystemTimePreciseAsFileTime)$

  - id: pelorus-c-printf-argv
    # Codacy's Opengrep rule insecure-use-printf-fn reports a command-line
    # argument passed straight into printf, sprintf or vsprintf, or copied
    # into a buffer that one of them reads later, whatever the format string;
    # it flagged the expect-reject message of the ABI history reader (pull
    # request 578). This rule refuses the same call shapes before CI.
    paths:
      include:
        - "*.c"
        - "*.h"
        - "**/*.c"
        - "**/*.h"
    message: >
      Command-line argument argv[$N] reaches $CALL. Codacy's Opengrep rule
      insecure-use-printf-fn reports this even with a literal format. Bind
      the argument to a named local and pass the local, as
      handle_expect_reject() in libpelorus/test/abi_history/abi_history.c
      does.
    languages: [c, cpp]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern: $CALL(..., argv[$N], ...)
          - pattern: |
              $COPY($BUF, argv[$N], ...);
              ...
              $CALL(..., $BUF, ...);
      - metavariable-regex:
          metavariable: $CALL
          regex: ^(printf|sprintf|vsprintf)$
      - metavariable-comparison:
          metavariable: $N
          comparison: int($N) > 0

  - id: pelorus-py-timeout-partial-output
    # subprocess.run fills TimeoutExpired.stdout and .stderr from the raw pipe
    # on POSIX, so they hold bytes even with text=True; on Windows they hold
    # str. The kit runner's timeout path passed the bytes to a str parser and
    # raised TypeError (pull request 578). Read them through a decoder that
    # accepts both.
    paths:
      include:
        - "*.py"
        - "**/*.py"
    message: >
      $E.$ATTR of subprocess.TimeoutExpired holds bytes on POSIX even when
      the call used text=True, and str on Windows. Pass it through
      _partial_text(), as _run_kit_runner() in
      scripts/check-tester-kit-install.py does.
    languages: [python]
    severity: ERROR
    patterns:
      - pattern-either:
          - pattern-inside: |
              try:
                  ...
              except subprocess.TimeoutExpired as $E:
                  ...
          - pattern-inside: |
              try:
                  ...
              except TimeoutExpired as $E:
                  ...
      - pattern: $E.$ATTR
      - metavariable-regex:
          metavariable: $ATTR
          regex: ^(stdout|stderr|output)$
      - pattern-not-inside: _partial_text($E.$ATTR)

  - id: pelorus-meson-options-file
    # meson.build declares meson_version '>=0.57.0'. Meson reads the newer
    # options file name only from 1.1 on, and an older Meson then refuses
    # every -D option the project passes (pull request 578: the tester-kit
    # self-test wrote it). scripts/test-semgrep-meson-options.py fails once
    # the floor reaches 1.1, so the rule goes with the floor.
    paths:
      include:
        - "*.py"
        - "**/*.py"
        - "*.sh"
        - "**/*.sh"
        - "meson.build"
        - "**/meson.build"
    message: >
      Meson reads meson.options only from 1.1 on, and meson.build declares
      meson_version '>=0.57.0'; an older Meson ignores the file and refuses
      the project's -D options. Name the file meson_options.txt.
    languages: [generic]
    severity: ERROR
    pattern-regex: \bmeson\.options\b

  - id: pelorus-smoke-skip-reason-head
    # pel_skip and pel_fail messages must not be derived from
    # `$(head -n 1 ...)` or `$(head ... | head -n 1)`. Taking the first line of a log often captures
    # driver initialization warnings (e.g. MESA experimental platform warnings)
    # rather than the real error (e.g. VK_ERROR_INITIALIZATION_FAILED).
    # Use pel_first_error instead, which searches for the first error/failed
    # line and falls back to the first non-warning line.
    languages: [generic]
    severity: ERROR
    message: >-
      pel_skip and pel_fail messages must not be built from head -n 1 (directly
      or after a pipe), which takes the first line (often a driver warning) instead of the real error;
      use pel_first_error instead.
    paths:
      include:
        - /ffmpeg-patches/test/*.sh
        - /scripts/**/*.sh
    pattern-regex: >-
      \bpel_(?:skip|fail)\b(?:[^\n"';\\]|\\\r?\n|"(?:[^\n"\\$]|\\.|\$(?!\()|\$\([^\n)]*\))*"|'[^'\n]*')*?(?:"(?:[^\n"\\$]|\\.|\$(?!\()|\$\([^\n)]*\))*?)?\$\([^\n)]*?\bhead\s+(?:[^\n)|]*?\s)?(?:-n\s*1|-1)\b[^\n)]*?\)
  - id: pelorus-shell-splice-into-inline-source
    # Splicing a shell expansion directly into inline interpreter source
    # code by closing and reopening the outer single quote (`'"$var"'`,
    # `'"${var}"'`, `'"prefix-$var"'`, `'$var'`, `'${var}'`, or
    # `'prefix-$var'`, also with quotes inside a braced expansion such as
    # `'"${var:-"$fallback"}"'`) exposes the program to syntax
    # corruption or code injection when the expanded value contains quotes or
    # special characters (defect fixed in scripts/test-abi-upgrade.sh at
    # commit 4a44da7). This rule inspects shell scripts for inline invocations
    # of python3, python, perl, ruby, and node (`-c` or `-e`, including
    # clustered flags and quoted options) with single-quoted programs that
    # perform such quote closures and reopenings. Spliced values must be
    # passed as argv arguments instead (e.g. sys.argv[1] in Python).
    # Plain echo outside any -c program stays quiet because echo is not an
    # inline interpreter command. Python stops reading source at its first
    # -c program and hands later arguments, a second -c included, to
    # sys.argv, so the Python prefix refuses a -c flag before the match;
    # perl and ruby run every -e and node runs its last one, so a later -e
    # stays in scope. scripts/test-semgrep-shell-splice.py plants each case.
    languages: [generic]
    severity: ERROR
    message: Pass the value as an argument (sys.argv) instead.
    paths:
      include:
        - "*.sh"
        - "**/*.sh"
        - "/ffmpeg-patches/test/**/*.sh"
    pattern-regex: >-
      \b(?:python[23]?(?:(?:\s|\\\r?\n)+(?!-[A-Za-z]*c(?![A-Za-z]))(?:[^\s'";|&\\]|"[^"\n]*"|'[^'\n]*')+)*?|(?:perl|ruby|node)(?:(?:\s|\\\r?\n)(?:[^\n'";|&\\]|\\\r?\n|"[^"\n]*"|'[^'\n]*')*?)?)(?:\s|\\\r?\n)+-[A-Za-z]*[ce](?:\s|\\\r?\n)*'(?:'\\''|[^'])*?('"(?:[^"$\n\\]|\\[^\r\n])*\$(?:\{[^}\n]*\}|[^"\n])*?"'|'(?:[^'"$\s\n\\]|\\[^\r\n])*\$[^'\s\n]*?')
  - id: pelorus-validate-which-executable
    # Executable found via shutil.which(...) passed to subprocess.run,
    # subprocess.Popen, subprocess.check_output, subprocess.call or
    # subprocess.check_call without validation.
    # Validate via Path(x).resolve(), is_file(), and os.access(..., os.X_OK).
    languages: [python]
    severity: ERROR
    message: >-
      Executable found via shutil.which(...) passed to subprocess without
      validation; resolve-and-validate via Path(x).resolve(), is_file(),
      and os.access(..., os.X_OK).
    paths:
      include:
        - "*.py"
        - "**/*.py"
    pattern-either:
      # Inline shutil.which in subprocess invocation
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC([shutil.which(...), ...], ...)
              - pattern: subprocess.$FUNC(shutil.which(...), ...)
              - patterns:
                  - pattern-inside: |
                      $CMD = [shutil.which(...), ...]
                      ...
                      subprocess.$FUNC($CMD, ...)
                  - pattern: subprocess.$FUNC($CMD, ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: '^(run|Popen|check_output|call|check_call)$'

      # Variable holding shutil.which passed to subprocess
      - patterns:
          - pattern-inside: |
              $VAR = shutil.which(...)
              ...
          - pattern-either:
              - pattern: subprocess.$FUNC([$VAR, ...], ...)
              - pattern: subprocess.$FUNC($VAR, ...)
              - patterns:
                  - pattern-inside: |
                      $CMD = [$VAR, ...]
                      ...
                      subprocess.$FUNC($CMD, ...)
                  - pattern: subprocess.$FUNC($CMD, ...)
              - patterns:
                  - pattern-inside: |
                      $P = <... Path($VAR) ...>
                      ...
                      subprocess.$FUNC([str($P), ...], ...)
                  - pattern: subprocess.$FUNC([str($P), ...], ...)
              - patterns:
                  - pattern-inside: |
                      $P = <... pathlib.Path($VAR) ...>
                      ...
                      subprocess.$FUNC([str($P), ...], ...)
                  - pattern: subprocess.$FUNC([str($P), ...], ...)
              - patterns:
                  - pattern-inside: |
                      $P = <... Path($VAR) ...>
                      ...
                      subprocess.$FUNC([$P, ...], ...)
                  - pattern: subprocess.$FUNC([$P, ...], ...)
              - patterns:
                  - pattern-inside: |
                      $P = <... pathlib.Path($VAR) ...>
                      ...
                      subprocess.$FUNC([$P, ...], ...)
                  - pattern: subprocess.$FUNC([$P, ...], ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: '^(run|Popen|check_output|call|check_call)$'
          # Guard suppression: call inside a branch whose condition
          # validates $VAR (or Path($VAR) bound to $P) un-negated:
          # os.access(..., os.X_OK), is_file() or os.path.isfile().
          # A call in an `if not <guard>:` branch stays reported, and so
          # does one whose guard is only one alternative of an `or`.
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    $VAR = shutil.which(...)
                    ...
                - pattern: |
                    if $COND:
                        ...
                        $BODY
                        ...
                - focus-metavariable: $BODY
                - metavariable-pattern:
                    metavariable: $COND
                    patterns:
                      - pattern-either:
                          - pattern: os.access($VAR, <... os.X_OK ...>)
                          - pattern: os.access(<... Path($VAR) ...>, <... os.X_OK ...>)
                          - pattern: os.access(<... pathlib.Path($VAR) ...>, <... os.X_OK ...>)
                          - pattern: Path($VAR).is_file(...)
                          - pattern: pathlib.Path($VAR).is_file(...)
                          - pattern: os.path.isfile($VAR)
                          - pattern: os.path.isfile(<... Path($VAR) ...>)
                          - pattern: os.path.isfile(<... pathlib.Path($VAR) ...>)
                      - pattern-not-inside: not $X
                      - pattern-not-inside: $X or $Y
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $VAR = shutil.which(...)
                        ...
                        $P = <... Path($VAR) ...>
                        ...
                    - pattern-inside: |
                        $VAR = shutil.which(...)
                        ...
                        $P = <... pathlib.Path($VAR) ...>
                        ...
                - pattern: |
                    if $COND:
                        ...
                        $BODY
                        ...
                - focus-metavariable: $BODY
                - metavariable-pattern:
                    metavariable: $COND
                    patterns:
                      - pattern-either:
                          - pattern: os.access($P, <... os.X_OK ...>)
                          - pattern: $P.is_file(...)
                          - pattern: os.path.isfile($P)
                      - pattern-not-inside: not $X
                      - pattern-not-inside: $X or $Y
          # Guard suppression: call after early-return on negated guard
          # 4. negated os.access with os.X_OK -> return
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.access($VAR, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... Path($VAR) ...>
              ...
              if <... not <... os.access($P, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... pathlib.Path($VAR) ...>
              ...
              if <... not <... os.access($P, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.access(<... Path($VAR) ...>, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.access(<... pathlib.Path($VAR) ...>, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          # 5. negated is_file() -> return
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... Path($VAR) ...>
              ...
              if <... not <... $P.is_file(...) ...> ...>:
                  ...
                  return ...
