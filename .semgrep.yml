#
# Custom semantic patterns for Pelorus (ADR-0239).
# Derived from VMAFx/vmafx .semgrep.yml at 25ee5f3a25aebc97ee453fc3a70f676c68da2a81
# (rule vmaf-test-float-identity-via-float-bits).

rules:
  - id: pelorus-test-float-identity
    # CodeQL cpp/equality-on-floats reports `==` / `!=` between two computed
    # floating-point values. It reads only what its build compiles. This rule
    # reads every test source before the push. Comparisons against a literal,
    # a macro or k-constant, and the `x != x` NaN idiom stay `==`, as CodeQL
    # allows them. The exemption covers a whole operand only (an optional sign
    # and one literal, macro or k-constant): `1.0 + y` or `(double)(y * 2.0)`
    # stays in scope. Literals cover decimal, hexadecimal and suffixed integer
    # forms (`0x10`, `1U`). A test source declares no non-const float with a
    # macro or k-constant name; scripts/test-semgrep-float-identity.py checks
    # that. The NaN idiom covers call-free operands only. Semgrep looks
    # through casts, so any operand cast to an integer type, such as
    # `(uint64_t)expected`, makes an integer comparison and is exempt.
    # scripts/test-semgrep-float-identity.py plants each case.
    patterns:
      - pattern-either:
          # One typed side is enough: Semgrep infers no type for an
          # arithmetic operand such as `1.0 + y`, so requiring both sides
          # typed missed every comparison with a computed expression.
          - pattern: (double $A) == $B
          - pattern: $A == (double $B)
          - pattern: (double $A) != $B
          - pattern: $A != (double $B)
          - pattern: (float $A) == $B
          - pattern: $A == (float $B)
          - pattern: (float $A) != $B
          - pattern: $A != (float $B)
          # Both sides arithmetic, such as `(x + y) == (u + v)`: neither
          # side carries an inferred type, so a floating-point operand inside
          # each side selects the comparison. One side is not enough:
          # `(i + (int)x) == j` compares integers.
          - patterns:
              - pattern-either:
                  - pattern: $A == $B
                  - pattern: $A != $B
              - metavariable-pattern:
                  metavariable: $A
                  patterns:
                    - pattern-either:
                        - pattern: (double $V)
                        - pattern: (float $V)
                    # A call argument is not an operand: `bits_of(a)`
                    # returns an integer.
                    - pattern-not-inside: $F(...)
              - metavariable-pattern:
                  metavariable: $B
                  patterns:
                    - pattern-either:
                        - pattern: (double $W)
                        - pattern: (float $W)
                    # A call argument is not an operand: `bits_of(a)`
                    # returns an integer.
                    - pattern-not-inside: $F(...)
      - pattern-not:
          patterns:
            - pattern-either:
                - pattern: $X == $X
                - pattern: $X != $X
            # only a call-free operand: `next() == next()` compares two
            # results and stays in scope
            - metavariable-regex:
                metavariable: $X
                regex: '^[^()]*$'
      # Semgrep types an operand through its cast, so `(uint64_t)expected`
      # reads as the double `expected`. An integer cast makes the comparison
      # an integer one; these pairs drop it.
      - pattern-not: $X == (uint8_t) $Y
      - pattern-not: (uint8_t) $Y == $X
      - pattern-not: $X != (uint8_t) $Y
      - pattern-not: (uint8_t) $Y != $X
      - pattern-not: $X == (uint16_t) $Y
      - pattern-not: (uint16_t) $Y == $X
      - pattern-not: $X != (uint16_t) $Y
      - pattern-not: (uint16_t) $Y != $X
      - pattern-not: $X == (uint32_t) $Y
      - pattern-not: (uint32_t) $Y == $X
      - pattern-not: $X != (uint32_t) $Y
      - pattern-not: (uint32_t) $Y != $X
      - pattern-not: $X == (uint64_t) $Y
      - pattern-not: (uint64_t) $Y == $X
      - pattern-not: $X != (uint64_t) $Y
      - pattern-not: (uint64_t) $Y != $X
      - pattern-not: $X == (int8_t) $Y
      - pattern-not: (int8_t) $Y == $X
      - pattern-not: $X != (int8_t) $Y
      - pattern-not: (int8_t) $Y != $X
      - pattern-not: $X == (int16_t) $Y
      - pattern-not: (int16_t) $Y == $X
      - pattern-not: $X != (int16_t) $Y
      - pattern-not: (int16_t) $Y != $X
      - pattern-not: $X == (int32_t) $Y
      - pattern-not: (int32_t) $Y == $X
      - pattern-not: $X != (int32_t) $Y
      - pattern-not: (int32_t) $Y != $X
      - pattern-not: $X == (int64_t) $Y
      - pattern-not: (int64_t) $Y == $X
      - pattern-not: $X != (int64_t) $Y
      - pattern-not: (int64_t) $Y != $X
      - pattern-not: $X == (size_t) $Y
      - pattern-not: (size_t) $Y == $X
      - pattern-not: $X != (size_t) $Y
      - pattern-not: (size_t) $Y != $X
      - pattern-not: $X == (int) $Y
      - pattern-not: (int) $Y == $X
      - pattern-not: $X != (int) $Y
      - pattern-not: (int) $Y != $X
      - pattern-not: $X == (unsigned) $Y
      - pattern-not: (unsigned) $Y == $X
      - pattern-not: $X != (unsigned) $Y
      - pattern-not: (unsigned) $Y != $X
      - pattern-not: $X == (long) $Y
      - pattern-not: (long) $Y == $X
      - pattern-not: $X != (long) $Y
      - pattern-not: (long) $Y != $X
      - pattern-not: $X == (bool) $Y
      - pattern-not: (bool) $Y == $X
      - pattern-not: $X != (bool) $Y
      - pattern-not: (bool) $Y != $X
      - pattern-not: $X == (char) $Y
      - pattern-not: (char) $Y == $X
      - pattern-not: $X != (char) $Y
      - pattern-not: (char) $Y != $X
      - pattern-not: $X == (signed char) $Y
      - pattern-not: (signed char) $Y == $X
      - pattern-not: $X != (signed char) $Y
      - pattern-not: (signed char) $Y != $X
      - pattern-not: $X == (unsigned char) $Y
      - pattern-not: (unsigned char) $Y == $X
      - pattern-not: $X != (unsigned char) $Y
      - pattern-not: (unsigned char) $Y != $X
      - pattern-not: $X == (short) $Y
      - pattern-not: (short) $Y == $X
      - pattern-not: $X != (short) $Y
      - pattern-not: (short) $Y != $X
      - pattern-not: $X == (unsigned short) $Y
      - pattern-not: (unsigned short) $Y == $X
      - pattern-not: $X != (unsigned short) $Y
      - pattern-not: (unsigned short) $Y != $X
      - pattern-not: $X == (unsigned int) $Y
      - pattern-not: (unsigned int) $Y == $X
      - pattern-not: $X != (unsigned int) $Y
      - pattern-not: (unsigned int) $Y != $X
      - pattern-not: $X == (unsigned long) $Y
      - pattern-not: (unsigned long) $Y == $X
      - pattern-not: $X != (unsigned long) $Y
      - pattern-not: (unsigned long) $Y != $X
      - pattern-not: $X == (long long) $Y
      - pattern-not: (long long) $Y == $X
      - pattern-not: $X != (long long) $Y
      - pattern-not: (long long) $Y != $X
      - pattern-not: $X == (unsigned long long) $Y
      - pattern-not: (unsigned long long) $Y == $X
      - pattern-not: $X != (unsigned long long) $Y
      - pattern-not: (unsigned long long) $Y != $X
      - pattern-not: $X == (ssize_t) $Y
      - pattern-not: (ssize_t) $Y == $X
      - pattern-not: $X != (ssize_t) $Y
      - pattern-not: (ssize_t) $Y != $X
      - pattern-not: $X == (ptrdiff_t) $Y
      - pattern-not: (ptrdiff_t) $Y == $X
      - pattern-not: $X != (ptrdiff_t) $Y
      - pattern-not: (ptrdiff_t) $Y != $X
      - pattern-not: $X == (intptr_t) $Y
      - pattern-not: (intptr_t) $Y == $X
      - pattern-not: $X != (intptr_t) $Y
      - pattern-not: (intptr_t) $Y != $X
      - pattern-not: $X == (uintptr_t) $Y
      - pattern-not: (uintptr_t) $Y == $X
      - pattern-not: $X != (uintptr_t) $Y
      - pattern-not: (uintptr_t) $Y != $X
      - metavariable-regex:
          metavariable: $A
          regex: '^(?!\s*[-+]?\s*([0-9][0-9.]*([eE][-+]?[0-9]+)?[fFlLuU]*|0[xX][0-9A-Fa-f]+[uUlL]*|\.[0-9]+([eE][-+]?[0-9]+)?[fFlL]?|0[xX]([0-9A-Fa-f]+(\.[0-9A-Fa-f]*)?|\.[0-9A-Fa-f]+)[pP][-+]?[0-9]+[fFlL]?|k[A-Z][A-Za-z0-9_]*|[A-Z][A-Z0-9_]*)\s*$)'
      - metavariable-regex:
          metavariable: $B
          regex: '^(?!\s*[-+]?\s*([0-9][0-9.]*([eE][-+]?[0-9]+)?[fFlLuU]*|0[xX][0-9A-Fa-f]+[uUlL]*|\.[0-9]+([eE][-+]?[0-9]+)?[fFlL]?|0[xX]([0-9A-Fa-f]+(\.[0-9A-Fa-f]*)?|\.[0-9A-Fa-f]+)[pP][-+]?[0-9]+[fFlL]?|k[A-Z][A-Za-z0-9_]*|[A-Z][A-Z0-9_]*)\s*$)'
    paths:
      include:
        - /libpelorus/test/**
        - /ffmpeg-patches/test/**
    message: >
      Two computed floating-point values are compared with == or !=. Compare
      via bit patterns (such as float_bits_equal() in
      libpelorus/test/interop_test.c) or an explicit tolerance; CodeQL
      cpp/equality-on-floats reports the same defect (ADR-0239).
    languages: [c, cpp]
    severity: ERROR

  - id: pelorus-validate-which-executable
    # Executable found via shutil.which(...) passed to subprocess.run,
    # subprocess.Popen, subprocess.check_output, subprocess.call or
    # subprocess.check_call without validation.
    # Validate via Path(x).resolve(), is_file(), and os.access(..., os.X_OK).
    languages: [python]
    severity: ERROR
    message: >-
      Executable found via shutil.which(...) passed to subprocess without
      validation; resolve-and-validate via Path(x).resolve(), is_file(),
      and os.access(..., os.X_OK).
    paths:
      include:
        - "*.py"
        - "**/*.py"
    pattern-either:
      # Inline shutil.which in subprocess invocation
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC([shutil.which(...), ...], ...)
              - pattern: subprocess.$FUNC(shutil.which(...), ...)
              - patterns:
                  - pattern-inside: |
                      $CMD = [shutil.which(...), ...]
                      ...
                      subprocess.$FUNC($CMD, ...)
                  - pattern: subprocess.$FUNC($CMD, ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: '^(run|Popen|check_output|call|check_call)$'

      # Variable holding shutil.which passed to subprocess
      - patterns:
          - pattern-inside: |
              $VAR = shutil.which(...)
              ...
          - pattern-either:
              - pattern: subprocess.$FUNC([$VAR, ...], ...)
              - pattern: subprocess.$FUNC($VAR, ...)
              - patterns:
                  - pattern-inside: |
                      $CMD = [$VAR, ...]
                      ...
                      subprocess.$FUNC($CMD, ...)
                  - pattern: subprocess.$FUNC($CMD, ...)
              - patterns:
                  - pattern-inside: |
                      $P = <... Path($VAR) ...>
                      ...
                      subprocess.$FUNC([str($P), ...], ...)
                  - pattern: subprocess.$FUNC([str($P), ...], ...)
              - patterns:
                  - pattern-inside: |
                      $P = <... pathlib.Path($VAR) ...>
                      ...
                      subprocess.$FUNC([str($P), ...], ...)
                  - pattern: subprocess.$FUNC([str($P), ...], ...)
              - patterns:
                  - pattern-inside: |
                      $P = <... Path($VAR) ...>
                      ...
                      subprocess.$FUNC([$P, ...], ...)
                  - pattern: subprocess.$FUNC([$P, ...], ...)
              - patterns:
                  - pattern-inside: |
                      $P = <... pathlib.Path($VAR) ...>
                      ...
                      subprocess.$FUNC([$P, ...], ...)
                  - pattern: subprocess.$FUNC([$P, ...], ...)
          - metavariable-regex:
              metavariable: $FUNC
              regex: '^(run|Popen|check_output|call|check_call)$'
          # Guard suppression: call inside a branch whose condition
          # validates $VAR (or Path($VAR) bound to $P) un-negated:
          # os.access(..., os.X_OK), is_file() or os.path.isfile().
          # A call in an `if not <guard>:` branch stays reported.
          - pattern-not-inside:
              patterns:
                - pattern-inside: |
                    $VAR = shutil.which(...)
                    ...
                - pattern: |
                    if $COND:
                        ...
                        $BODY
                        ...
                - focus-metavariable: $BODY
                - metavariable-pattern:
                    metavariable: $COND
                    patterns:
                      - pattern-either:
                          - pattern: os.access($VAR, <... os.X_OK ...>)
                          - pattern: os.access(<... Path($VAR) ...>, <... os.X_OK ...>)
                          - pattern: os.access(<... pathlib.Path($VAR) ...>, <... os.X_OK ...>)
                          - pattern: Path($VAR).is_file(...)
                          - pattern: pathlib.Path($VAR).is_file(...)
                          - pattern: os.path.isfile($VAR)
                          - pattern: os.path.isfile(<... Path($VAR) ...>)
                          - pattern: os.path.isfile(<... pathlib.Path($VAR) ...>)
                      - pattern-not-inside: not $X
          - pattern-not-inside:
              patterns:
                - pattern-either:
                    - pattern-inside: |
                        $VAR = shutil.which(...)
                        ...
                        $P = <... Path($VAR) ...>
                        ...
                    - pattern-inside: |
                        $VAR = shutil.which(...)
                        ...
                        $P = <... pathlib.Path($VAR) ...>
                        ...
                - pattern: |
                    if $COND:
                        ...
                        $BODY
                        ...
                - focus-metavariable: $BODY
                - metavariable-pattern:
                    metavariable: $COND
                    patterns:
                      - pattern-either:
                          - pattern: os.access($P, <... os.X_OK ...>)
                          - pattern: $P.is_file(...)
                          - pattern: os.path.isfile($P)
                      - pattern-not-inside: not $X
          # Guard suppression: call after early-return on negated guard
          # 4. negated os.access with os.X_OK -> return
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.access($VAR, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... Path($VAR) ...>
              ...
              if <... not <... os.access($P, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... pathlib.Path($VAR) ...>
              ...
              if <... not <... os.access($P, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.access(<... Path($VAR) ...>, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.access(<... pathlib.Path($VAR) ...>, <... os.X_OK ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          # 5. negated is_file() -> return
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... Path($VAR) ...>
              ...
              if <... not <... $P.is_file(...) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... pathlib.Path($VAR) ...>
              ...
              if <... not <... $P.is_file(...) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... Path($VAR).is_file(...) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... pathlib.Path($VAR).is_file(...) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          # 6. negated os.path.isfile -> return
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.path.isfile($VAR) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... Path($VAR) ...>
              ...
              if <... not <... os.path.isfile($P) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              $P = <... pathlib.Path($VAR) ...>
              ...
              if <... not <... os.path.isfile($P) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.path.isfile(<... Path($VAR) ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)
          - pattern-not-inside: |
              $VAR = shutil.which(...)
              ...
              if <... not <... os.path.isfile(<... pathlib.Path($VAR) ...>) ...> ...>:
                  ...
                  return ...
              ...
              subprocess.$F(...)

