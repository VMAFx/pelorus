# Codacy configuration (https://docs.codacy.com/repositories-configure/codacy-configuration-file/,
# read 2026-11-04). Codacy reads this file from the default branch, a pull request's changes
# to it apply to that pull request's analysis, and once it exists the ignored-files settings
# of the Codacy UI no longer apply: every exclusion lives here.
#
# Each exclusion names one tracked file for one engine, its verdict and an exception line
# `exception: category <A-D>, entered <date>, expires <date>`. scripts/check-codacy-config.py
# fails on a glob, a missing or untracked file, a missing exception line, an interval longer
# than the category allows (B 3 days, C 10, D 120), an expired entry, and any line that is not
# a comment, engines:, an unquoted engine key, exclude_paths: or a block list item.
engines:
  bandit:
    exclude_paths:
      # B310 (urlopen with a permitted scheme). The engine adoption in pull request 479
      # renders this file with download_player_archive, whose urlopen call (:269 there) sits
      # behind a guard that refuses every URL that is not https (:265 there), so the scheme
      # the rule warns about cannot reach it. The file is engine-managed; the fix belongs
      # upstream in cordanaLLM/praetor#1802. Remove this entry once that fix is adopted.
      # exception: category B, entered 2026-11-04, expires 2026-11-07
      - "tools/figures/mkdocs_hook.py"
  flawfinder:
    exclude_paths:
      # flawfinder_open (CWE-362) fires on every open() call. The one call here, in
      # create_exclusive (:104), opens a test temp file with O_CREAT | O_EXCL | O_NOFOLLOW,
      # which fails on any existing name or link, so the race the rule warns about cannot
      # occur. Inline markers in C are refused by scripts/check-suppression-markers.py
      # (ADR-0241); remove this entry once that check accepts a reasoned C marker.
      # exception: category D, entered 2026-11-04, expires 2027-03-04
      - "libpelorus/test/x265_csv_characterization_test.c"
  opengrep:
    exclude_paths:
      # python urllib urlopen rule, same call and same https-only guard as the bandit entry.
      # exception: category B, entered 2026-11-04, expires 2026-11-07
      - "tools/figures/mkdocs_hook.py"
      # Semgrep_c_misc_rule-fopen-open, same call and same O_EXCL | O_NOFOLLOW reasoning
      # as the flawfinder entry.
      # exception: category D, entered 2026-11-04, expires 2027-03-04
      - "libpelorus/test/x265_csv_characterization_test.c"
