# Codacy configuration (https://docs.codacy.com/repositories-configure/codacy-configuration-file/,
# read 2026-11-04). Codacy reads this file from the default branch, a pull request's changes
# to it apply to that pull request's analysis, and once it exists the ignored-files settings
# of the Codacy UI no longer apply: every exclusion lives here.
#
# Each exclusion names one tracked file for one engine, its verdict and an exception line
# `exception: category <A-D>, entered <date>, expires <date>`. scripts/check-codacy-config.py
# fails on a glob, a missing or untracked file, a missing exception line, an interval longer
# than the category allows (B 3 days, C 10, D 120), an expired entry, and any line that is not
# a comment, engines:, an unquoted engine key, exclude_paths: or a block list item.
engines:
  flawfinder:
    exclude_paths:
      # flawfinder_open (CWE-362) fires on every open() call. The one call here, in
      # create_exclusive (:104), opens a test temp file with O_CREAT | O_EXCL | O_NOFOLLOW,
      # which fails on any existing name or link, so the race the rule warns about cannot
      # occur. Inline markers in C are refused by scripts/check-suppression-markers.py
      # (ADR-0241); remove this entry once that check accepts a reasoned C marker.
      # exception: category D, entered 2026-11-04, expires 2027-03-04
      - "libpelorus/test/x265_csv_characterization_test.c"
      # flawfinder_open (CWE-362) and flawfinder_memcpy (CWE-120) fire on every open() and
      # memcpy() call. open_write_exclusive (:85) opens with O_CREAT | O_EXCL | O_NOFOLLOW,
      # open_read_regular (:189) opens with O_RDONLY | O_NOFOLLOW and verifies S_ISREG via
      # fstat (:196), and mode_read (:267) checks blob_len >= PELORUS_SIDEDATA_UUID_LEN +
      # sizeof(hdr) (:260) right before memcpy. Inline markers in C are refused by
      # scripts/check-suppression-markers.py (ADR-0241).
      # exception: category D, entered 2026-11-05, expires 2027-03-05
      - "tools/abi-upgrade/abi_upgrade_probe.c"
      # flawfinder_memcpy (CWE-120) fires on every memcpy() call. The digest and model-hash
      # copies (:198, :226) copy sizeof(destination), which _Static_assert (:162, :206) ties
      # to the source size. Inline markers in C are refused by
      # scripts/check-suppression-markers.py (ADR-0241).
      # exception: category D, entered 2026-11-08, expires 2027-03-08
      - "libpelorus/test/abi_history/abi_history_fill.c"
      # flawfinder_memcpy (CWE-120) fires on every memcpy() call. Each copy here is bounded
      # first: append_map checks UUID_LEN + off + size <= cap (:34) before :37,
      # patch_section refuses a pointer outside the blob, a copy longer than the found
      # section or past cap (:60) before :63, invoke_pack checks packed_len <= cap (:417)
      # before :422, and abih_pack_history_blob checks the header fits (:453) before :456 and
      # :458. Inline markers in C are refused by scripts/check-suppression-markers.py (ADR-0241).
      # exception: category D, entered 2026-11-08, expires 2027-03-08
      - "libpelorus/test/abi_history/abi_history_pack.c"
      # flawfinder_memcpy (CWE-120) fires on every memcpy() call. Each copy here is bounded
      # first: validate_map_bounds (:77) and abih_read_and_verify_blob (:577) check the header
      # fits before :81 and :581. Inline markers in C are refused by
      # scripts/check-suppression-markers.py (ADR-0241).
      # exception: category D, entered 2026-11-08, expires 2027-03-08
      - "libpelorus/test/abi_history/abi_history_check.c"
  opengrep:
    exclude_paths:
      # Semgrep_c_misc_rule-fopen-open, same call and same O_EXCL | O_NOFOLLOW reasoning
      # as the flawfinder entry.
      # exception: category D, entered 2026-11-04, expires 2027-03-04
      - "libpelorus/test/x265_csv_characterization_test.c"
      # Semgrep_c_misc_rule-fopen-open, same open() calls and O_EXCL | O_NOFOLLOW / fstat
      # S_ISREG reasoning as the flawfinder entry.
      # exception: category D, entered 2026-11-05, expires 2027-03-05
      - "tools/abi-upgrade/abi_upgrade_probe.c"
      # Semgrep_c_buffer_rule-memcpy-CopyMemory, same memcpy() calls and same bound checks
      # (_Static_assert :162, :206) as the flawfinder entry. Inline markers in C are refused
      # by scripts/check-suppression-markers.py (ADR-0241).
      # exception: category D, entered 2026-11-08, expires 2027-03-08
      - "libpelorus/test/abi_history/abi_history_fill.c"
      # Semgrep_c_buffer_rule-memcpy-CopyMemory, same memcpy() calls and same bound checks
      # (:34, :60, :417, :453) as the flawfinder entry. Inline markers in C are refused by
      # scripts/check-suppression-markers.py (ADR-0241).
      # exception: category D, entered 2026-11-08, expires 2027-03-08
      - "libpelorus/test/abi_history/abi_history_pack.c"
      # Semgrep_c_buffer_rule-memcpy-CopyMemory, same memcpy() calls and same bound checks
      # (:77, :577) as the flawfinder entry. Inline markers in C are refused by
      # scripts/check-suppression-markers.py (ADR-0241).
      # exception: category D, entered 2026-11-08, expires 2027-03-08
      - "libpelorus/test/abi_history/abi_history_check.c"
