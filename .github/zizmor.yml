#
# zizmor configuration (scripts/check-python-lint.sh, #495).
#
# self-repository: zizmor 1.32.0 asks for the `uses: $/...` form, but the
# pinned actionlint 1.7.12 (ci.yml) refuses it as a malformed reusable
# workflow call (rhysd/actionlint#711, open on 2026-11-04). Revisit when an
# actionlint release accepts `$/`; then switch both calls and drop this entry.
rules:
  self-repository:
    ignore:
      - release.yml:18
      - release.yml:29
      # #501: the same actionlint refusal holds for a step `uses: $/...`
      # (tested with 1.7.12: "ref is missing"), so the callers of
      # .github/actions/load-build-config keep `./`.
      - ci.yml
      - codeql.yml
      - devcontainer-image.yml
      - release-build.yml
      - reuse.yml
      - standards-gate.yml
      - tester-publish.yml
      - windows-tester.yml
  # github-env: the load-build-config composite action writes the pins read
  # from the checked-out build-config.env to GITHUB_ENV. zizmor cannot see the
  # caller triggers from inside an action; every caller runs on push,
  # pull_request, schedule, workflow_dispatch or workflow_call, never on
  # pull_request_target or workflow_run (#501).
  github-env:
    ignore:
      - action.yml:12
