#
# zizmor configuration (scripts/check-python-lint.sh, #495).
#
# self-repository: zizmor 1.32.0 asks for the `uses: $/...` form, but the
# pinned actionlint 1.7.12 (ci.yml) refuses it as a malformed reusable
# workflow call (rhysd/actionlint#711, open on 2026-11-04). Revisit when an
# actionlint release accepts `$/`; then switch both calls and drop this entry.
rules:
  self-repository:
    ignore:
      - release.yml:18
      - release.yml:29
