name: Load build configuration
description: Export the pinned FFmpeg and Go build pins from build-config.env to GITHUB_ENV.

runs:
  using: composite
  steps:
    - name: Export build pins
      shell: bash
      run: |
        grep -E '^(FFMPEG_REMOTE|FFMPEG_TAG|FFMPEG_COMMIT|GO_VERSION)=' build-config.env >> "$GITHUB_ENV"
