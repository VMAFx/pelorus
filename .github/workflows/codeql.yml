name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # codeql-action/analyze uploads its SARIF to GitHub code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - name: Install toolchain
        if: github.event.pull_request.draft != true && matrix.language == 'c-cpp'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build glslc glslang-tools clang clang-format clang-tidy \
            locales pkg-config
      - name: Configure libpelorus (pre-init to exclude probe files from CodeQL DB)
        if: github.event.pull_request.draft != true && matrix.language == 'c-cpp'
        run: meson setup --werror "${{ runner.temp }}/build"
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: github.event.pull_request.draft != true
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build libpelorus (manual build mode for c-cpp)
        if: github.event.pull_request.draft != true && matrix.language == 'c-cpp'
        run: ninja -C "${{ runner.temp }}/build"
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: github.event.pull_request.draft != true
        with:
          category: /language:${{ matrix.language }}
