name: Changelog render pull request

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-render-pr
  cancel-in-progress: false

jobs:
  render:
    name: Open the changelog render pull request
    if: github.repository == 'VMAFx/pelorus'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the render pull request is due
        id: decide
        run: python3 -I scripts/release/check-changelog-staleness.py --open-after-hours 6 >> "$GITHUB_OUTPUT"
      - name: Release-bot settings are present
        id: settings
        if: steps.decide.outputs.open == 'true' || steps.decide.outputs.current == 'true'
        env:
          CLIENT_ID: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          HAS_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY != '' }}
          RENDER_DUE: ${{ steps.decide.outputs.open }}
        run: python3 -I scripts/release/open-render-pr.py --check-settings --due "$RENDER_DUE" >> "$GITHUB_OUTPUT"
      - name: Mint the release-bot installation token
        id: app-token
        if: steps.settings.outputs.present == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Render and open, or close, the render pull request
        if: steps.settings.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          RENDER_DUE: ${{ steps.decide.outputs.open }}
        run: python3 -I scripts/release/open-render-pr.py --due "$RENDER_DUE" --app-slug "$APP_SLUG" --branch chore/changelog-render-auto
