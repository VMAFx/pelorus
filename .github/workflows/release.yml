name: Release

# Tag pushes publish. workflow_dispatch runs the same gates, build,
# attestation and signing but deliberately cannot create a GitHub release.
# A vX.Y.Z-rc.N tag publishes a prerelease that is never "latest" (ADR-0176).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Full CI (core, FFmpeg patch-stack replay + link, sanitizers, Windows, docs)
  # must pass on the tagged commit before anything is built for release.
  ci:
    uses: ./.github/workflows/ci.yml

  # Build, SBOM, SLSA provenance and cosign signature in the reusable workflow
  # (ADR-0169): its identity, not this file's, signs the attestation.
  build:
    needs: ci
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the attested release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: dist
      - name: Publish GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          artifact_label="${GITHUB_REF_NAME//\//-}"
          sha256sum --check SHA256SUMS
          # The release build classified the tag; an empty value is a bug, not "final".
          case "$PRERELEASE" in
            true) kind=(--prerelease --latest=false) ;;
            false) kind=() ;;
            *) echo "::error::release build did not classify ${GITHUB_REF_NAME}"; exit 1 ;;
          esac
          extra=()
          if [ -f CANDIDATE_LEGS.json ]; then extra+=(CANDIDATE_LEGS.json); fi
          gh release create "${GITHUB_REF_NAME}" \
            --title "Pelorus ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "${kind[@]}" \
            "pelorus-ffmpeg-patches-${artifact_label}.tar.gz" \
            "pelorus-ffmpeg-patches-${artifact_label}.spdx.json" \
            "pelorus-ffmpeg-patches-${artifact_label}.provenance.sigstore.json" \
            SHA256SUMS \
            SHA256SUMS.sigstore.json \
            "${extra[@]}"
          # The flag on the forge must match the tag; a mismatch fails the run.
          actual="$(gh release view "${GITHUB_REF_NAME}" --json isPrerelease --jq .isPrerelease)"
          if [ "$actual" != "$PRERELEASE" ]; then
            echo "::error::release ${GITHUB_REF_NAME} has isPrerelease=${actual}, expected ${PRERELEASE}"
            exit 1
          fi
