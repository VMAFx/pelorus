name: Release build

# Reusable release build (ADR-0169). It builds and tests libpelorus, packages
# the FFmpeg patch stack, writes an SPDX SBOM, and attests SLSA build
# provenance in the same job, so the attestation is signed with this
# workflow's identity, isolated from the caller (SLSA Build Level 3). It then
# signs SHA256SUMS keyless with cosign and uploads everything for the caller's
# publish job. No artefact is downloaded or restored from a cache before the
# attestation. release.yml is the only caller.
on:
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded artefact that holds the release files
        value: ${{ jobs.build.outputs.artifact-name }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load build configuration
        run: |
          while IFS= read -r entry; do
            case "$entry" in
              FFMPEG_REMOTE=*|FFMPEG_TAG=*|FFMPEG_COMMIT=*)
                printf '%s\n' "$entry" >> "$GITHUB_ENV"
                ;;
            esac
          done < build-config.env
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build glslc glslang-tools pkg-config
      - name: Runner and toolchain receipt
        run: |
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          cat /etc/os-release
          glslc --version
          glslangValidator --version
      - name: Configure (warnings are errors)
        run: meson setup --werror build
      - name: Build
        run: make build BUILD_DIR=build
      - name: Fast tests
        run: meson test -C build --suite=fast --print-errorlogs
      - name: Tag matches the project version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          project_version="$(meson introspect --projectinfo build \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" != "$project_version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match meson.build version ${project_version}"
            exit 1
          fi
      - name: Changelog is rendered
        run: bash scripts/release/concat-changelog-fragments.sh --check
      - name: Extract release notes (the [Unreleased] block)
        run: |
          mkdir -p dist
          awk '/<!-- BEGIN UNRELEASED/{f=1;next} /<!-- END UNRELEASED/{f=0} f' \
            CHANGELOG.md | sed '/^## \[Unreleased\]/d' > dist/RELEASE_NOTES.md
          echo "--- notes ---"
          cat dist/RELEASE_NOTES.md
      - name: Package the FFmpeg patch stack
        id: package
        run: |
          artifact_label="${GITHUB_REF_NAME//\//-}"
          printf 'ARTIFACT_LABEL=%s\n' "$artifact_label" >> "$GITHUB_ENV"
          printf 'artifact-name=pelorus-release-%s\n' "$artifact_label" >> "$GITHUB_OUTPUT"
          tar czf "dist/pelorus-ffmpeg-patches-${artifact_label}.tar.gz" \
            ffmpeg-patches/series.txt ffmpeg-patches/README.md \
            ffmpeg-patches/0*.patch ffmpeg-patches/files \
            LICENSES/LGPL-2.1-or-later.txt LICENSES/EUPL-1.2.txt
      - name: SBOM of the release archive (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          file: dist/pelorus-ffmpeg-patches-${{ env.ARTIFACT_LABEL }}.tar.gz
          format: spdx-json
          output-file: dist/pelorus-ffmpeg-patches-${{ env.ARTIFACT_LABEL }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum "pelorus-ffmpeg-patches-${ARTIFACT_LABEL}.tar.gz" \
            "pelorus-ffmpeg-patches-${ARTIFACT_LABEL}.spdx.json" > SHA256SUMS
          cat SHA256SUMS
      - name: Attest build provenance (SLSA v1.0)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/pelorus-ffmpeg-patches-${{ env.ARTIFACT_LABEL }}.tar.gz
            dist/pelorus-ffmpeg-patches-${{ env.ARTIFACT_LABEL }}.spdx.json
      - name: Keep the provenance bundle with the release files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/pelorus-ffmpeg-patches-${ARTIFACT_LABEL}.provenance.sigstore.json"
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign SHA256SUMS (keyless)
        working-directory: dist
        run: cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
      - name: Verify the SHA256SUMS signature
        working-directory: dist
        run: |
          cosign verify-blob \
            --certificate-identity-regexp '^https://github\.com/VMAFx/pelorus/\.github/workflows/release-build\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle SHA256SUMS.sigstore.json \
            SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload the release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact-name }}
          path: dist/
          if-no-files-found: error
