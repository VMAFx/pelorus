name: Dev container image

# Builds the dev container toolchain base image from
# .devcontainer/base/Containerfile (ADR-0153, ADR-0235). A pull request that touches the
# Containerfile, its licence record or the licence gate it runs, or this
# workflow builds the image and pushes nothing. A push to
# master that touches them, or a manual run, builds it, pushes
# ghcr.io/vmafx/pelorus-dev tagged with the commit SHA and latest, and attests
# SLSA build provenance for the pushed digest.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.devcontainer/base/**'
      - 'tools/tester/licensing.py'
      - 'LICENSES/EUPL-1.2.txt'
      - '.github/workflows/devcontainer-image.yml'
  push:
    branches: [master]
    paths:
      - '.devcontainer/base/**'
      - 'tools/tester/licensing.py'
      - 'LICENSES/EUPL-1.2.txt'
      - '.github/workflows/devcontainer-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/vmafx/pelorus-dev

jobs:
  build:
    # Pull requests only: build the image, push nothing. The first step is the
    # Praetor hosted-gate draft step (HISS-18), so a draft does not spend a build.
    name: Build pelorus-dev (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: github.event.pull_request.draft != true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        if: github.event.pull_request.draft != true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/base/Containerfile
          build-args: PELORUS_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:pr-${{ github.sha }}
          push: false

  publish:
    name: Build, push and attest pelorus-dev
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/base/Containerfile
          build-args: PELORUS_COMMIT=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          push: true
          provenance: false
          sbom: false
      - name: Verify digest and record summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          if ! printf '%s\n' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::registry returned no sha256 digest for $IMAGE:$GITHUB_SHA: '$DIGEST'"
            exit 1
          fi
          printf 'Pushed %s@%s (tags %s, latest).\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance (SLSA v1.0)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
