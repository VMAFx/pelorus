name: Dev container image

# Builds the dev container toolchain base image from
# .devcontainer/base/Containerfile (ADR-0153, ADR-0235, ADR-0250). A pull request that touches the
# Containerfile, its licence record, the licence gate it runs, the smoke check,
# the Makefile, or this workflow builds the image, loads it into the local Docker
# daemon, runs the offline native gate inside the container with network disabled,
# and pushes nothing. A push to master that touches them, or a manual run, builds
# and loads the image, runs the offline native gate, logs in to ghcr.io, pushes the
# image tagged with the commit SHA and latest from the builder cache, asserts that
# the loaded and pushed digests match, and attests SLSA build provenance for the
# pushed digest.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.devcontainer/base/**'
      - 'tools/tester/licensing.py'
      - 'LICENSES/EUPL-1.2.txt'
      - 'scripts/check-devcontainer-image.py'
      - 'Makefile'
      - '.github/workflows/devcontainer-image.yml'
  push:
    branches: [master]
    paths:
      - '.devcontainer/base/**'
      - 'tools/tester/licensing.py'
      - 'LICENSES/EUPL-1.2.txt'
      - 'scripts/check-devcontainer-image.py'
      - 'Makefile'
      - '.github/workflows/devcontainer-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Pull requests only: build the image, run the offline native gate in it,
    # push nothing. The first step is the Praetor hosted-gate draft step
    # (HISS-18), so a draft does not spend a build.
    name: Build pelorus-dev (no push)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        uses: ./.github/actions/draft-gate
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
          # Full history: the offline gate's scripts/check-interop-abi-history.py reads released ABI tags (issue #467)
          fetch-depth: 0
      - name: Compute image name
        id: image
        if: github.event.pull_request.draft != true
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-dev"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        if: github.event.pull_request.draft != true
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build
        id: build
        if: github.event.pull_request.draft != true
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/base/Containerfile
          build-args: |
            PELORUS_COMMIT=${{ github.sha }}
            PELORUS_SOURCE=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.image.outputs.name }}:pr-${{ github.sha }}
          push: false
          load: true
          provenance: false
          sbom: false
      - name: Run the offline gate in the image
        if: github.event.pull_request.draft != true
        timeout-minutes: 25
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:pr-${{ github.sha }}
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" "$IMAGE_REF" python3 -I /src/scripts/check-devcontainer-image.py --source /src

  publish:
    name: Build, push and attest pelorus-dev
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the offline gate's scripts/check-interop-abi-history.py reads released ABI tags (issue #467)
          fetch-depth: 0
      - name: Compute image name
        id: image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-dev"
          echo "IMAGE=${image}" >> "$GITHUB_ENV"
          echo "name=${image}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and load
        id: load
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/base/Containerfile
          build-args: |
            PELORUS_COMMIT=${{ github.sha }}
            PELORUS_SOURCE=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          push: false
          load: true
          provenance: false
          sbom: false
      - name: Run the offline gate in the image
        timeout-minutes: 25
        env:
          IMAGE_REF: ${{ steps.image.outputs.name }}:${{ github.sha }}
        run: |
          docker run --rm --network none -v "$GITHUB_WORKSPACE:/src:ro" "$IMAGE_REF" python3 -I /src/scripts/check-devcontainer-image.py --source /src
      - name: Log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .devcontainer/base/Containerfile
          build-args: |
            PELORUS_COMMIT=${{ github.sha }}
            PELORUS_SOURCE=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          push: true
          provenance: false
          sbom: false
      - name: Verify digest and record summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          LOADED: ${{ steps.load.outputs.digest }}
        run: |
          if ! printf '%s\n' "$DIGEST" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::registry returned no sha256 digest for $IMAGE:$GITHUB_SHA: '$DIGEST'"
            exit 1
          fi
          if ! printf '%s\n' "$LOADED" | grep -Eqx 'sha256:[0-9a-f]{64}'; then
            echo "::error::builder returned no sha256 digest for loaded image: '$LOADED'"
            exit 1
          fi
          if [ "$LOADED" != "$DIGEST" ]; then
            echo "::error::loaded image digest '$LOADED' does not match pushed digest '$DIGEST'"
            exit 1
          fi
          printf 'Pushed %s@%s (tags %s, latest; offline gate passed in the image before push).\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Attest build provenance (SLSA v1.0)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
