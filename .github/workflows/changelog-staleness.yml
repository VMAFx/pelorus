name: Changelog staleness

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: changelog-staleness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  staleness:
    name: Changelog staleness
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changelog staleness
        run: python3 -I scripts/release/check-changelog-staleness.py
