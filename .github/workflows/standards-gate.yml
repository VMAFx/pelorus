name: Standards

# Praetor/HISS governance gate (ADR-0145). No path filter: baseline and context
# integrity cover every pull request.
on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: standards-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  standards:
    name: Standards & Invariant Verification Gate
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      PRAETOR_REF: 492a00f930e1a2df557ffebb76564cfa65637b77
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: false

      - name: Install pinned Praetor engine
        run: |
          go install "github.com/cordanaLLM/praetor/cmd/standardsctl@${PRAETOR_REF}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # `standardsctl version` names the build commit since Praetor #722; the
      # module pseudo-version in Go's build info is checked as well, so the
      # step fails if the installed engine is not the pinned commit.
      - name: Report governance engine version
        run: |
          standardsctl version
          go version -m "$(command -v standardsctl)" | grep -F "${PRAETOR_REF:0:12}"

      - name: Verify canonical agent contexts
        run: standardsctl compile-context --verify

      # Commit policy (HISS-14). A commit made with its hooks skipped carries no
      # proof that the commit-msg hook ran, so CI re-checks every commit of the
      # pull request range: a Conventional Commits subject, the `Migration:`
      # footer on a breaking change, and the `Signed-off-by` trailer (DCO) that
      # CONTRIBUTING asks for. The range ends at the pull request head, not at
      # the synthetic merge commit the checkout holds. Event values travel
      # through env, never through `${{ }}` inside the command.
      - name: Enforce commit message policy (Conventional Commits, HISS-14 Migration footer)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: standardsctl forge check-commits --base "origin/${BASE_REF}" --head "${HEAD_SHA}"

      - name: Verify DCO sign-off on every pull request commit
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          missing=0
          # A failed or empty rev-list would let the loop pass on no commits.
          shas="$(git rev-list --no-merges "origin/${BASE_REF}..${HEAD_SHA}")"
          if [ -z "${shas}" ]; then
            echo "::error::no commits between origin/${BASE_REF} and ${HEAD_SHA}; cannot verify DCO"
            exit 1
          fi
          for sha in ${shas}; do
            # Bot commits are exempt (CONTRIBUTING.md): only when the bot opened
            # the pull request and authored the commit, so a person cannot opt
            # out by copying the bot's author line.
            author="$(git show -s --format=%ae "${sha}")"
            case "${PR_AUTHOR}:${author}" in
              'renovate[bot]:29139614+renovate[bot]@users.noreply.github.com')
                echo "${sha}: Renovate commit in a Renovate pull request, DCO exempt"
                continue
                ;;
            esac
            if ! git show -s --format=%B "${sha}" | grep -Eq '^Signed-off-by: [^<>]+ <[^<>[:space:]]+@[^<>[:space:]]+>$'; then
              echo "::error::${sha} has no Signed-off-by trailer (DCO); amend with git commit -s"
              missing=$((missing + 1))
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            echo "${missing} commit(s) lack a Signed-off-by trailer" >&2
            exit 1
          fi

      # HISS-13 ratchet (ADR-0145), in two steps. `--base` turns on the engine's
      # growth guard: the committed baseline may not record more findings than
      # the one on the target (pull request) or the replaced commit (push),
      # unless the increase was recorded with `baseline --record
      # --allow-increase --reason`, which the audit prints as a WARN. `--base`
      # alone would also revoke every baselined finding in a touched file
      # (zero-debt mode, still deferred); the debt-delta reason instead fails a
      # touched file only when one of its rules gains a finding.
      - name: Audit HISS invariants against baseline
        env:
          AUDIT_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          DEBT_DELTA_REASON: >-
            ADR-0145 baseline ratchet; touched files keep baselined debt
            but may not add findings; zero-debt mode deferred
        run: >-
          standardsctl audit --base "$AUDIT_BASE"
          --touched-debt-delta-reason "$DEBT_DELTA_REASON"

      # Debt-delta mode accepts a touched file whose findings moved lines. This
      # step still requires the committed baseline to record every current
      # finding at its current line, so stale fingerprints cannot reach master
      # and fail a later pull request that does not touch that file.
      - name: Verify baseline records every current finding
        run: standardsctl baseline --verify
