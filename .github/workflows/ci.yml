name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # The Release workflow calls this file so a tag publishes only after the
  # full CI matrix (FFmpeg stack, sanitizers, Windows, docs) is green.
  workflow_call:

permissions:
  contents: read

concurrency:
  # In a called run the context is the caller's, so the workflow name keeps a
  # Release call out of a push/PR run's group (no mutual cancellation).
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: libpelorus (build · test · format · tidy)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load build configuration
        run: |
          while IFS= read -r entry; do
            case "$entry" in
              FFMPEG_REMOTE=*|FFMPEG_TAG=*|FFMPEG_COMMIT=*)
                printf '%s\n' "$entry" >> "$GITHUB_ENV"
                ;;
            esac
          done < build-config.env
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build glslc glslang-tools clang clang-format clang-tidy \
            pkg-config
      - name: Runner and toolchain receipt
        run: |
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          cat /etc/os-release
          glslc --version
          glslangValidator --version
      - name: Configure + build
        run: meson setup --werror build && ninja -C build
      - name: Optimised gcc build (-O2, warnings are errors)
        # gcc raises -Wmaybe-uninitialized only with the optimiser on, which the
        # default debug build above does not run.
        run: CC=gcc meson setup --werror build-o2 --buildtype=debugoptimized && ninja -C build-o2
      - name: Test (fast suite — interop ABI + shader compile)
        run: meson test -C build --suite=fast --print-errorlogs
      - name: clang-format (touched-tree clean)
        run: find libpelorus \( -name '*.c' -o -name '*.h' \) -exec clang-format --dry-run --Werror {} +
      - name: clang-tidy
        # Every unit of the .standards.yaml clang_tidy lane (ADR-0168).
        run: grep -Ev '^(#|$)' .config/clang-tidy/lane-files.txt | xargs clang-tidy -p build

  ffmpeg-stack:
    name: ffmpeg patch stack (regenerate · replay · link · smoke)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load build configuration
        run: |
          while IFS= read -r entry; do
            case "$entry" in
              FFMPEG_REMOTE=*|FFMPEG_TAG=*|FFMPEG_COMMIT=*)
                printf '%s\n' "$entry" >> "$GITHUB_ENV"
                ;;
            esac
          done < build-config.env
      - name: Install native build and Vulkan toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config nasm yasm git ca-certificates \
            libvulkan-dev glslc glslang-tools libvpl-dev libaom-dev \
            libsvtav1enc-dev libffmpeg-nvenc-dev
      - name: Runner and toolchain receipt
        run: |
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          cat /etc/os-release
          for module in vulkan vpl aom SvtAv1Enc ffnvcodec; do
            printf '%s=' "$module"
            pkg-config --modversion "$module"
          done
          glslc --version
          glslangValidator --version
      - name: Fetch and verify pinned FFmpeg source
        run: |
          git init ffmpeg
          git -C ffmpeg remote add origin "$FFMPEG_REMOTE"
          git -C ffmpeg fetch --depth=1 origin \
            "refs/tags/${FFMPEG_TAG}:refs/tags/${FFMPEG_TAG}"
          actual=$(git -C ffmpeg rev-parse --verify \
            "refs/tags/${FFMPEG_TAG}^{commit}")
          test "$actual" = "$FFMPEG_COMMIT" || {
            echo "::error::${FFMPEG_TAG} peels to ${actual}, expected ${FFMPEG_COMMIT}"
            exit 1
          }
      - name: Patches match deterministic regeneration
        run: |
          FFMPEG_REPO="$GITHUB_WORKSPACE/ffmpeg" \
            WORKTREE="$RUNNER_TEMP/pelorus-gen-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            ffmpeg-patches/generate.sh
          if ! git diff --quiet -- ffmpeg-patches/; then
            echo "::error::generated FFmpeg patches differ from canonical files"
            git diff --stat -- ffmpeg-patches/
            git diff -- ffmpeg-patches/ | head -200
            exit 1
          fi
          echo "committed patches are byte-identical to fresh regeneration"
      - name: Replay all patches, link FFmpeg, and verify registrations
        run: |
          FFMPEG_REPO="$GITHUB_WORKSPACE/ffmpeg" \
            ffmpeg-patches/test/build-and-run.sh

  lavapipe:
    # Mesa lavapipe is software Vulkan: this lane runs the real shaders of the
    # 22-patch stack with the Khronos validation layer on, and its result is
    # functional evidence only, never GPU evidence (#228, docs/research/0228).
    # It builds the stack once more (45 minute budget) because the stack job
    # discards its binary.
    name: lavapipe (software Vulkan · ten filters · validation · format matrix)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - name: Load build configuration
        if: github.event.pull_request.draft != true
        run: |
          while IFS= read -r entry; do
            case "$entry" in
              FFMPEG_REMOTE=*|FFMPEG_TAG=*|FFMPEG_COMMIT=*)
                printf '%s\n' "$entry" >> "$GITHUB_ENV"
                ;;
            esac
          done < build-config.env
      - name: Install native build toolchain and lavapipe
        if: github.event.pull_request.draft != true
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential meson ninja-build pkg-config nasm yasm git ca-certificates \
            libvulkan-dev glslc glslang-tools \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers
      - name: Runner and toolchain receipt
        if: github.event.pull_request.draft != true
        run: |
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          cat /etc/os-release
          dpkg-query -W -f='${Package}=${Version}\n' \
            mesa-vulkan-drivers vulkan-tools vulkan-validationlayers libvulkan-dev
          glslc --version
          glslangValidator --version
      - name: Fetch and verify pinned FFmpeg source
        if: github.event.pull_request.draft != true
        run: |
          git init ffmpeg
          git -C ffmpeg remote add origin "$FFMPEG_REMOTE"
          git -C ffmpeg fetch --depth=1 origin \
            "refs/tags/${FFMPEG_TAG}:refs/tags/${FFMPEG_TAG}"
          actual=$(git -C ffmpeg rev-parse --verify \
            "refs/tags/${FFMPEG_TAG}^{commit}")
          test "$actual" = "$FFMPEG_COMMIT" || {
            echo "::error::${FFMPEG_TAG} peels to ${actual}, expected ${FFMPEG_COMMIT}"
            exit 1
          }
      - name: Replay all patches, link FFmpeg, keep the binary
        if: github.event.pull_request.draft != true
        run: |
          echo "LANE_DIR=$RUNNER_TEMP/pelorus-lane" >> "$GITHUB_ENV"
          FFMPEG_REPO="$GITHUB_WORKSPACE/ffmpeg" KEEP_DIR="$RUNNER_TEMP/pelorus-lane" \
            ffmpeg-patches/test/build-and-run.sh
      - name: Select the lavapipe ICD
        if: github.event.pull_request.draft != true
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          if [ "${#icds[@]}" -ne 1 ]; then
            echo "::error::expected one lavapipe ICD in /usr/share/vulkan/icd.d, found ${#icds[@]}"
            ls -l /usr/share/vulkan/icd.d
            exit 1
          fi
          {
            echo "VK_DRIVER_FILES=${icds[0]}"
            echo "LD_LIBRARY_PATH=$LANE_DIR/lib"
            echo "FFMPEG_BIN=$LANE_DIR/ffmpeg"
            echo "PELORUS_VALIDATE=1"
          } >> "$GITHUB_ENV"
          echo "lavapipe ICD: ${icds[0]}"
      - name: Device guard refuses planted defects
        if: github.event.pull_request.draft != true
        run: |
          ffmpeg-patches/test/vulkan-lavapipe-guard.sh --self-test
          for rule in device_count device_type driver extensions feature subgroup layer; do
            if ffmpeg-patches/test/vulkan-lavapipe-guard.sh --self-test --disable "$rule" \
              >/dev/null 2>&1; then
              echo "::error::guard self-test stays green with rule $rule switched off"
              exit 1
            fi
          done
          ffmpeg-patches/test/vulkan-lavapipe-filters.sh --self-test
          ffmpeg-patches/test/vulkan-lavapipe-report.sh --self-test
      - name: Device is lavapipe with the required extensions (never a GPU)
        if: github.event.pull_request.draft != true
        run: |
          vulkaninfo --summary
          ffmpeg-patches/test/vulkan-lavapipe-guard.sh
      - name: All ten filters run clean under validation
        if: github.event.pull_request.draft != true
        run: ffmpeg-patches/test/vulkan-lavapipe-filters.sh
      - name: Format matrix under validation
        if: github.event.pull_request.draft != true
        run: |
          # Exit 77 is the matrix's skip code (no usable device). A skip is no
          # evidence, so the lane fails on it like on any other non-zero exit.
          ffmpeg-patches/test/vulkan-format-matrix.sh
      - name: Tester report says software_vulkan and functional
        if: github.event.pull_request.draft != true
        run: ffmpeg-patches/test/vulkan-lavapipe-report.sh

  sanitizers:
    name: libpelorus (ASan + UBSan — the interop conformance fixture)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load build configuration
        run: |
          while IFS= read -r entry; do
            case "$entry" in
              FFMPEG_REMOTE=*|FFMPEG_TAG=*|FFMPEG_COMMIT=*)
                printf '%s\n' "$entry" >> "$GITHUB_ENV"
                ;;
            esac
          done < build-config.env
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            meson ninja-build clang pkg-config glslc glslang-tools
      - name: Runner and toolchain receipt
        run: |
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          cat /etc/os-release
          glslc --version
          glslangValidator --version
      - name: Build + run the fixture under ASan/UBSan
        env:
          CC: clang
        run: |
          # Meson's sanitizer option adds the runtime to every shared-library
          # link. Make alignment UB fatal: issue #44 otherwise logged and passed.
          meson setup --werror build-san -Db_sanitize=address,undefined -Db_lundef=false \
            -Dc_args=-fno-sanitize-recover=alignment
          meson test -C build-san --suite=fast --print-errorlogs

  windows:
    # ADR-0149: the native Windows leg. It exists for the Windows-only halves of
    # the fast suite (the UTF-8 -> UTF-16 _wfopen path contract) and to keep
    # libpelorus building warning-free with MinGW-w64 GCC on the UCRT runtime.
    name: libpelorus (Windows · MSYS2 UCRT64 · fast suite)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Check out without CRLF conversion
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-glslang
            mingw-w64-ucrt-x86_64-shaderc
      - name: Load build configuration
        run: |
          while IFS= read -r entry; do
            case "$entry" in
              FFMPEG_REMOTE=*|FFMPEG_TAG=*|FFMPEG_COMMIT=*)
                printf '%s\n' "$entry" >> "$GITHUB_ENV"
                ;;
            esac
          done < build-config.env
      - name: Runner and toolchain receipt
        run: |
          echo "ImageOS=${ImageOS:-unset}"
          echo "ImageVersion=${ImageVersion:-unset}"
          echo "MSYSTEM=${MSYSTEM}"
          uname -a
          pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-meson mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-glslang mingw-w64-ucrt-x86_64-shaderc
          gcc --version
          meson --version
          python3 --version
          glslc --version
          glslangValidator --version
      - name: Configure + build
        run: meson setup --werror build && ninja -C build
      - name: Test (fast suite, including the UTF-8 path contract)
        run: meson test -C build --suite=fast --print-errorlogs
      - name: UTF-8 path contract transcript
        run: meson test -C build path-utf8 --verbose

  docs:
    name: docs + changelog + workflow hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load build configuration
        run: |
          while IFS= read -r entry; do
            case "$entry" in
              FFMPEG_REMOTE=*|FFMPEG_TAG=*|FFMPEG_COMMIT=*)
                printf '%s\n' "$entry" >> "$GITHUB_ENV"
                ;;
            esac
          done < build-config.env
      - name: Changelog fragments render cleanly
        run: bash scripts/release/concat-changelog-fragments.sh --check
      - name: Every ADR has an index row
        run: |
          missing=0
          for adr in docs/adr/[0-9]*.md; do
            n=$(basename "$adr" .md); n=${n%%-*}
            [ "$n" = "0000" ] && continue
            grep -q "\[$n\](" docs/adr/README.md || {
              echo "ADR $n missing from index"
              missing=1
            }
          done
          exit $missing
      - name: ADR status matches merge state
        run: |
          python3 -I scripts/adr/check-status.py --self-test
          python3 -I scripts/adr/check-status.py
      - name: Tracked hardware reports validate and the index is current
        run: |
          python3 -I tools/tester/pelorus_tester_report.py --self-test
          python3 -I scripts/hardware-reports/check-reports.py --self-test
          python3 -I scripts/hardware-reports/check-reports.py
          python3 -I scripts/hardware-reports/generate-index.py --self-test
          python3 -I scripts/hardware-reports/generate-index.py --check
      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.x'
          cache: false
      - name: Validate workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
