# Lefthook Configuration (HISS Governance)
# Pelorus additions to the generated jobs: pre-commit pelorus-audit (make audit
# in the hosted debt-delta mode, offline like hiss-audit) and pre-push
# verify-all (make verify-all). no_auto_install keeps hook installation
# explicit (make hooks-install): lefthook run never rewrites the hooks in the
# Git directory that every linked worktree shares when this file changes.
# Go and Rust jobs follow the detected languages; both when none was detected.
# Governance commands fail closed: a failing or missing praetorctl blocks the
# commit or push. The pre-commit audit runs --offline; the pre-push audit
# reads the forge's live Actions state when a token and a github.com origin
# are present. The pre-push gate job signs a receipt only after a Go
# (go.mod) or Cargo (Cargo.lock) toolchain stage ran. A root with neither
# gets no receipt: the job names the languages it could not verify and
# admits the push; a root with either fails when its stages did not run.
---
no_auto_install: true
agent-checkpoint-tool:
  commands:
    checkpoint:
      run: >-
        sh .config/lefthook/python.sh -B .config/lefthook/scripts/checkpoint.py
        --event tool --json --marker
agent-checkpoint-stop:
  commands:
    checkpoint:
      run: >-
        sh .config/lefthook/python.sh -B .config/lefthook/scripts/checkpoint.py
        --event stop --json --marker
pre-commit:
  parallel: true
  commands:
    context-check:
      run: >-
        if praetor_cli=$(command -v praetorctl 2>/dev/null || command -v
        standardsctl 2>/dev/null); then "$praetor_cli" compile-context --verify;
        else echo HISS governance hook cannot run because neither praetorctl nor
        standardsctl is installed >&2; exit 1; fi
    hiss-audit:
      run: >-
        if praetor_cli=$(command -v praetorctl 2>/dev/null || command -v
        standardsctl 2>/dev/null); then "$praetor_cli" audit --offline; else
        echo HISS governance hook cannot run because neither praetorctl nor
        standardsctl is installed >&2; exit 1; fi
    pelorus-audit:
      run: make audit AUDIT_FLAGS=--offline

post-commit:
  commands:
    state-sync:
      run: >-
        if praetor_cli=$(command -v praetorctl 2>/dev/null || command -v
        standardsctl 2>/dev/null); then "$praetor_cli" state sync .; else echo
        HISS governance hook cannot run because neither praetorctl nor
        standardsctl is installed >&2; exit 1; fi
    dedupe-cadence:
      run: >-
        if praetor_cli=$(command -v praetorctl 2>/dev/null || command -v
        standardsctl 2>/dev/null); then "$praetor_cli" dedupe cadence
        --threshold=20 --record .; else echo HISS governance hook cannot run
        because neither praetorctl nor standardsctl is installed >&2; exit 1; fi

pre-push:
  parallel: false
  commands:
    flavor-audit:
      run: >-
        if praetor_cli=$(command -v praetorctl 2>/dev/null || command -v
        standardsctl 2>/dev/null); then "$praetor_cli" flavor audit .; else echo
        HISS governance hook cannot run because neither praetorctl nor
        standardsctl is installed >&2; exit 1; fi
    audit:
      run: >-
        if praetor_cli=$(command -v praetorctl 2>/dev/null || command -v
        standardsctl 2>/dev/null); then "$praetor_cli" audit; else echo HISS
        governance hook cannot run because neither praetorctl nor standardsctl
        is installed >&2; exit 1; fi
    gate:
      run: >-
        if praetor_cli=$(command -v praetorctl 2>/dev/null || command -v
        standardsctl 2>/dev/null); then "$praetor_cli" gate run --path=.
        --admit-unsupported; else echo HISS governance hook cannot run because
        neither praetorctl nor standardsctl is installed >&2; exit 1; fi
    verify-all:
      run: make verify-all
