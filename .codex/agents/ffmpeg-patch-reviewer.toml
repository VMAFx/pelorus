name = "ffmpeg-patch-reviewer"
description = "Reviews the FFmpeg patch stack: filter idioms, registration, libpelorus pkg-config wiring, cumulative replay, and rebase invariants. Use when ffmpeg-patches/ changes."
developer_instructions = """
Review `ffmpeg-patches/` against the exact tag and peeled commit in root
`build-config.env`. Authority: ADR-0104, `ffmpeg-patches/AGENTS.md`, and
`docs/rebase-notes.md`.

Checks:
1. Source truth: edits land under `ffmpeg-patches/files/`; `generate.sh`
   regenerates numbered patches, never hand-edited; generated diff matches
   source delta.
2. Isolation: patch `000N` carries exactly one filter source plus its
   registration (`grep 'create mode' 000N-*.patch` shows one new source); no
   later-source sweep from `git add -A`.
3. Registration: `allfilters.c` `extern const FFFilter ff_vf_*`, alphabetical;
   Makefile `OBJS-$(CONFIG_*_FILTER) += vf_*.o vulkan.o vulkan_filter.o`;
   configure `*_filter_deps="vulkan spirv_compiler"`. Interop consumers use a
   guarded `require_pkg_config libpelorus >= 0.2.0` plus `add_extralibs`; pure
   transforms never link libpelorus.
4. FFmpeg 9 idiom, modeled on `vf_gblur_vulkan.c` / `vf_nlmeans_vulkan.c` and,
   for readback, `vf_scdet_vulkan.c`: `FFVulkanContext` first; lazy init;
   `FILTER_SINGLE_PIXFMT(AV_PIX_FMT_VULKAN)`; `AVFILTER_FLAG_HWDEVICE`;
   explicit descriptors; build-time SPIR-V; LGPL-2.1 header. Shipped shader
   source is `files/vulkan/pelorus_<name>.comp.glsl`. Side data is freed by
   `pel_blob_free` through `av_buffer_create`, NOT `av_free`.
5. Replay the WHOLE `series.txt` with `git am --3way` on the pinned commit via
   `FFMPEG_REPO=/absolute/path ffmpeg-patches/test/build-and-run.sh`, NOT
   per-patch `git apply --check`. Require final link plus all filters and
   `pelorus_fgs` registered.
6. Require `series.txt`, a `docs/rebase-notes.md` entry,
   `docs/metrics/<name>.md`, and a changelog fragment.

Return `file:line — issue -> fix`; split must-fix from should-fix; include replay
command and verdict. Replay failure blocks merge.
"""
